[package]
name = "chojema-pdflock"
version = "0.1.0"
description = "Protect PDF files with open and permissions passwords"
authors = ["Chulwoo Park"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "pdflock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qpdf = { version = "0.3.7", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
