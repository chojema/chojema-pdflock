<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chojema PDFLock</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="app">
      <section class="files">
        <div class="drop" id="drop">
          <div id="empty" class="empty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14" /></svg>
            <p data-i18n="dropHint"></p>
          </div>
          <div id="card" class="card" hidden>
            <div id="pageBox" class="page-box">
              <canvas id="page" data-i18n-label="previewLabel"></canvas>
              <p id="pageMsg" class="hint" hidden></p>
            </div>
            <p id="cardName" class="card-name"></p>
            <p id="cardDir" class="muted card-dir"></p>
          </div>
          <button type="button" id="pick" class="secondary"></button>
        </div>
      </section>

      <section class="settings">
        <fieldset>
          <legend data-i18n="openTitle"></legend>
          <p class="hint" data-i18n="openHint"></p>
          <div class="pw"><input id="openPw" type="password" autocomplete="new-password" data-i18n-ph="openPh" /></div>
        </fieldset>

        <fieldset>
          <legend data-i18n="permTitle"></legend>
          <p class="hint" data-i18n="permHint"></p>
          <div class="pw"><input id="permPw" type="password" autocomplete="new-password" data-i18n-ph="permPh" /></div>
          <div id="perms" class="perms">
            <label class="row"><span data-i18n="print"></span>
              <select id="print">
                <option value="full" data-i18n="printFull"></option>
                <option value="low" data-i18n="printLow"></option>
                <option value="none" data-i18n="printNone"></option>
              </select>
            </label>
            <label><input type="checkbox" id="modify" /> <span data-i18n="modify"></span></label>
            <label><input type="checkbox" id="extract" /> <span data-i18n="extract"></span></label>
            <label><input type="checkbox" id="accessibility" checked /> <span data-i18n="accessibility"></span></label>
            <label><input type="checkbox" id="annotate" /> <span data-i18n="annotate"></span></label>
            <label><input type="checkbox" id="fillForms" checked /> <span data-i18n="fillForms"></span></label>
            <label><input type="checkbox" id="assemble" /> <span data-i18n="assemble"></span></label>
          </div>
        </fieldset>

        <label class="check"><input type="checkbox" id="show" /> <span data-i18n="showPw"></span></label>

        <fieldset class="save-box">
          <legend data-i18n="saveTitle"></legend>
          <div class="save-row">
            <span id="fileName" class="name"></span>
            <button type="button" id="save" class="secondary small" data-i18n="save"></button>
            <button type="button" id="saveAs" class="secondary small" data-i18n="saveAs" aria-expanded="false" aria-controls="saveAsRow"></button>
          </div>
          <div id="saveAsRow" class="save-row" hidden>
            <input id="newName" type="text" data-i18n-label="saveAs" />
            <button type="button" id="saveNamed" class="primary small" data-i18n="save"></button>
            <button type="button" id="browse" class="link" data-i18n="browse"></button>
          </div>
          <p id="status" class="status" aria-live="polite"></p>
          <p id="error" class="error" role="alert"></p>
        </fieldset>
        <footer class="muted"><span id="version"></span> · AES-256</footer>
      </section>
    </main>

    <dialog id="confirm" aria-labelledby="confirmMsg">
      <p id="confirmMsg"></p>
      <div class="dialog-actions">
        <button type="button" id="confirmNo" class="secondary" data-i18n="cancel"></button>
        <button type="button" id="confirmYes" class="primary"></button>
      </div>
    </dialog>
  </body>
</html>
